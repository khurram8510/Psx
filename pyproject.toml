[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmi30-agent"
version = "0.1.0"
description = "Real-time KMI-30 index monitor for the Pakistan Stock Exchange with trend-deviation alerts to Slack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kmi30 = "kmi30.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kmi30 = ["static/*.html", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
